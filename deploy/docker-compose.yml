services:
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres
    env_file:
        - ../.env
    environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nox} -d ${DB_NAME:-noxdb}"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s
    ports:
        - "${DB_PORT}:5432"
    volumes:
        - postgres_data:/var/lib/postgresql

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    env_file:
        - ../.env
    ports:
        - "${VM_PORT}:8428"
    volumes:
        - vmdata:/victoria-metrics-data
    command:
        - "-retentionPeriod=14d"
        - "-storageDataPath=/victoria-metrics-data"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    env_file:
        - ../.env
    ports:
        - "${JAEGER_MP}:16686"
        - "${JAEGER_PORT}:4318"
    volumes:
        - jaeger_data:/badger
    environment:
        - COLLECTOR_OTLP_ENABLED=true
        - SPAN_STORAGE_TYPE=badger

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
        - ../.env
    ports:
        - "${GRAFANA_PORT}:3000"
    environment:
        - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN}
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PWD}
        - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
        - grafana_data:/var/lib/grafana

  app:
    build:
      context: ../
      dockerfile: src/Dockerfile
    container_name: steam-api-scraper
    env_file:
        - ../.env
    environment:
        - DB_HOST=postgres-db
        - DB_PORT=5432
    ports:
        - "8000:8000"
    volumes:
        - ../src/task/config/config.toml:/app/config.toml
    depends_on:
        - posgtres-db
        - grafana
        - victoriametrics
        - jaeger

volumes:
    postgres_data:
    vmdata:
    jaeger_data:
    grafana_data:
